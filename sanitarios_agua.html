<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YOCALCULO - Instalación Sanitaria</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e24">
    <link rel="icon" type="image/png" href="icono.png">
    <link rel="apple-touch-icon" href="icono.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* FONDO GENERAL ADAPTATIVO */
        body { 
            margin: 0; 
            background-color: #1e1e24; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            overflow-y: auto; 
            font-family: 'Nunito', sans-serif; 
        }

        /* LIENZO AJUSTADO PARA MÓVILES */
        .contenedor-app-yocalculo { 
            position: relative; 
            width: 100%; 
            height: 960px; 
            max-width: 432px; 
            background-color: #F4F5F7; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0px 10px 40px rgba(0,0,0,0.8); 
            flex-shrink: 0; 
            margin: 10px 0;
        }

        @media (max-width: 600px) { 
            body { align-items: center; }
            .contenedor-app-yocalculo { 
                max-width: none; 
                width: 100vw; 
                height: 100vh; 
                box-shadow: none; 
                border: none; 
                margin: 0;
            } 
        }

        .status-bar { background-color: transparent; height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #EBEBEB; flex-shrink: 0; }
        .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
        
        .pantalla { display: none; flex: 1; flex-direction: column; overflow: hidden; height: calc(100% - 36px); position: relative; }
        .pantalla.activa { display: flex; }
        
        .header-nativo { background-color: #4B4B4D; color: #FFFFFF; padding: 15px; display: flex; align-items: center; flex-shrink: 0; }
        .btn-back-nativo { background: transparent; border: none; color: #FFFFFF; font-size: 20px; cursor: pointer; padding: 0; margin-right: 15px; }
        .header-title { font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
        
        /* CONTENEDOR DE SCROLL RESPONSIVO */
        .contenido-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            padding-bottom: 120px; 
            box-sizing: border-box; 
            -webkit-overflow-scrolling: touch;
        }

        .tarjeta-blanca { background-color: #FFFFFF; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #EBEBEB; box-sizing: border-box; border-radius: 6px; }
        .seccion-titulo { color: #4B4B4D; font-size: 14px; font-weight: 800; text-transform: uppercase; margin-top: 0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F4F5F7; padding-bottom: 4px; }
        
        label { color: #7A7A7A; display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
        input[type="number"], input[type="text"], select { width: 100%; padding: 8px 0; background-color: transparent; border: none; border-bottom: 1px solid #CCCCCC; box-sizing: border-box; font-size: 16px; color: #4B4B4D; outline: none; font-weight: bold; margin-bottom: 15px; font-family: 'Nunito', sans-serif; }
        input:focus, select:focus { border-bottom: 2px solid #4B4B4D; }
        
        .mapa-contenedor { position: relative; width: 100%; aspect-ratio: 591 / 1000; background-image: url('plano.jpg'); background-size: 100% 100%; border: 1px solid #EBEBEB; }
        .zona-click { position: absolute; background-color: transparent !important; border: none !important; cursor: pointer; z-index: 10; }
        .z-bano { top: 31%; left: 15%; width: 26%; height: 11%; }
        .z-lavadero { top: 32%; left: 51%; width: 24%; height: 14%; }
        .z-cocina { top: 43%; left: 15%; width: 28%; height: 9%; }
        
        .barra-inferior { position: absolute; bottom: 0; left: 0; width: 100%; background: #FFFFFF; padding: 15px 20px; box-sizing: border-box; border-top: 1px solid #E5E5E5; z-index: 99; }
        .btn-amarillo-fijo { width: 100%; padding: 15px; background-color: #FBDD23; color: #4B4B4D; border: none; font-weight: 900; font-size: 16px; text-transform: uppercase; cursor: pointer; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="contenedor-app-yocalculo">
        <div id="pantalla-plano" class="pantalla activa">
            <div class="header-nativo"><button class="btn-back-nativo" onclick="location.href='index.html?skip=1'">&#10094;</button><h2 class="header-title">Instalación Sanitaria</h2></div>
            <div class="contenido-scroll">
                <div class="mapa-contenedor">
                    <button class="zona-click z-bano" onclick="abrirFormulario('Baño')"></button>
                    <button class="zona-click z-lavadero" onclick="abrirFormulario('Lavadero')"></button>
                    <button class="zona-click z-cocina" onclick="abrirFormulario('Cocina')"></button>
                </div>
            </div>
            <div class="barra-inferior"><button class="btn-amarillo-fijo" onclick="computarTotal()">Generar Cómputo</button></div>
        </div>
    </div>
</body>
</html>
