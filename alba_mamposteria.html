<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YOCALCULO - Mampostería</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e24">
    <link rel="apple-touch-icon" href="icono.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { margin: 0; background-color: #1e1e24; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        .contenedor-app-yocalculo { position: relative; width: 100%; height: 100%; max-width: 432px; max-height: 960px; aspect-ratio: 432 / 960; background-color: #F4F5F7; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0px 10px 40px rgba(0,0,0,0.8); flex-shrink: 0; }
        @media (max-width: 600px) { .contenedor-app-yocalculo { max-width: none; max-height: none; aspect-ratio: auto; width: 100vw; height: 100vh; box-shadow: none; border: none; } }
        .status-bar { background-color: transparent; height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; border-bottom: 1px solid #EBEBEB; flex-shrink: 0; }
        .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
        .pantalla { display: none; flex: 1; flex-direction: column; overflow: hidden; height: calc(100% - 36px); position: relative; } 
        .pantalla.activa { display: flex; }
        .header-nativo { background-color: #4B4B4D; color: #FFFFFF; padding: 15px; display: flex; align-items: center; flex-shrink: 0; }
        .btn-back-nativo { background: transparent; border: none; color: #FFFFFF; font-size: 20px; cursor: pointer; padding: 0; margin-right: 15px; }
        .header-title { font-size: 16px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 0.5px;}
        .contenido-scroll { flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 110px; box-sizing: border-box; }
        .tarjeta-blanca { background-color: #FFFFFF; padding: 16px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid #EBEBEB; box-sizing: border-box; border-radius: 6px; }
        .tarjeta-ml { background-color: #FFFDF0; border: 2px solid #FBDD23; text-align: center; }
        .seccion-titulo { color: #4B4B4D; font-size: 14px; font-weight: 800; text-transform: uppercase; margin-top: 0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #F4F5F7; padding-bottom: 4px; }
        label { color: #7A7A7A; display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; text-transform: uppercase; }
        input[type="number"], input[type="text"], select { width: 100%; padding: 8px 0; background-color: transparent; border: none; border-bottom: 1px solid #CCCCCC; box-sizing: border-box; font-size: 16px; color: #4B4B4D; outline: none; font-weight: bold; margin-bottom: 15px; }
        input[type="number"]:focus, input[type="text"]:focus, select:focus { border-bottom: 2px solid #4B4B4D; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .barra-inferior { position: absolute; bottom: 0; left: 0; width: 100%; background: #FFFFFF; padding: 15px 20px; box-sizing: border-box; border-top: 1px solid #E5E5E5; z-index: 5; flex-shrink: 0; }
        .btn-amarillo-fijo { width: 100%; padding: 15px; background-color: #FBDD23; color: #4B4B4D; border: none; font-weight: 900; font-size: 16px; text-transform: uppercase; cursor: pointer; transition: filter 0.2s; border-radius: 6px;}
        .btn-amarillo-fijo:active { filter: brightness(0.95); transform: scale(0.98); }
        .btn-gris-fijo { width: 100%; padding: 15px; background-color: #4B4B4D; color: #FBDD23; border: none; font-weight: 900; font-size: 15px; text-transform: uppercase; cursor: pointer; transition: filter 0.2s; display: flex; justify-content: center; align-items: center; gap: 6px; border-radius: 6px;}
        .btn-gris-fijo:active { transform: scale(0.98); }
        
        .btn-descargar-archivo-txt { width: 100%; padding: 12px; background-color: #7A7A7A; color: #FFFFFF; border: none; font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; text-align: center; box-sizing: border-box; margin-bottom: 15px; display: block; border-radius: 4px; transition: background-color 0.1s; }
        .btn-descargar-archivo-txt:active { background-color: #636363; }

        .btn-whatsapp-proveedor { width: 100%; padding: 12px; background-color: #2ECC71; color: #FFFFFF; border: none; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; text-align: center; border-radius: 4px; display: block; text-decoration: none; box-sizing: border-box; margin-top: 10px; }
        .btn-whatsapp-proveedor:active { background-color: #27AE60; }

        .banner-publicitario-estatico-fijo { position: absolute; bottom: 76px; left: 15px; width: calc(100% - 30px); aspect-ratio: 1080 / 450; background-color: #EBEBEB; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1px dashed #7A7A7A; box-sizing: border-box; z-index: 4; }
        .scroll-con-publicidad-fija { padding-bottom: 240px; }

        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #F4F5F7; font-size: 13px; color: #4B4B4D; display: flex; justify-content: space-between; align-items: center; }
        li:last-child { border-bottom: none; }
        .destacado { font-weight: bold; font-size: 13px; color: #000; background: #F4F5F7; padding: 2px 6px; border-radius: 4px; }
        .subitem-titulo { font-size: 11px; font-weight: 800; color: #7A7A7A; text-transform: uppercase; margin-top: 10px; margin-bottom: 4px; letter-spacing: 0.5px; background: #FFF; padding: 2px 0; }
        .cargando-presupuesto { text-align: center; padding: 40px 20px; display: none; }
        .spinner { border: 4px solid #EBEBEB; border-top: 4px solid #FBDD23; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tarjeta-zona-libre { background-color: #1e1e24; color: #FFFFFF; padding: 20px 15px; border-radius: 8px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.2); border: 2px solid #FBDD23; margin-bottom: 15px; }
        .tarjeta-zona-libre h3 { margin-top: 0; color: #FBDD23; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;}
        .tarjeta-zona-libre p { font-size: 13px; line-height: 1.4; color: #EBEBEB; margin-bottom: 12px; text-align: left; }
        .tarjeta-zona-libre ul { list-style: none; padding: 0; margin: 0 0 15px 0; text-align: left; }
        .tarjeta-zona-libre li { color: #FFFFFF; font-size: 12px; margin-bottom: 8px; border-bottom: none; display: flex; align-items: flex-start; padding: 0; line-height: 1.3;}
        .tarjeta-zona-libre li::before { content: '✔'; color: #FBDD23; margin-right: 8px; font-weight: bold;}
        .btn-mp-proveedor { background-color: #FBDD23; color: #1e1e24; border: none; padding: 14px; width: 100%; font-size: 14px; font-weight: 900; text-transform: uppercase; border-radius: 6px; cursor: pointer; text-decoration: none; display: block; box-sizing: border-box; transition: transform 0.1s;}
        .btn-mp-proveedor:active { transform: scale(0.98); }
        .tarjeta-upsell { background-color: #F4F5F7; border: 1px dashed #7A7A7A; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; }
    </style>
</head>
