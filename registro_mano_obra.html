<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YOCALCULO - Buscador de Mano de Obra</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* FONDO GENERAL ADAPTATIVO CON LIBERACIÓN DE SCROLL vertical */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            background-color: #1e1e24; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            overflow-y: auto; 
            font-family: 'Nunito', sans-serif; 
        }

        /* LIENZO AJUSTADO SIN BLOQUEOS RÍGIDOS */
        .contenedor-app { 
            position: relative; 
            height: 960px; 
            width: 100%; 
            max-width: 432px; 
            background-color: #F8F9FA; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-sizing: border-box; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            margin: 10px 0;
        }
        
        @media (max-width: 600px) { 
            body {
                align-items: center;
            }
            .contenedor-app { 
                max-width: none; 
                width: 100vw; 
                height: 100vh; 
                box-shadow: none; 
                border: none; 
                margin: 0;
            } 
        }
        
        /* HEADER NATIVO MODERNO */
        .header-nativo { background-color: #1e1e24; padding: 18px 20px; display: flex; align-items: center; flex-shrink: 0; box-sizing: border-box; width: 100%; border-bottom: 3px solid #FBDD23; }
        .btn-back-nativo { background: transparent; border: none; color: #FFFFFF; font-size: 22px; cursor: pointer; padding: 0; margin-right: 15px; transition: transform 0.2s; }
        .btn-back-nativo:active { transform: scale(0.9); }
        .header-title { font-size: 16px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 0.5px; color: #FFFFFF !important; }
        
        /* SCROLL INTERNO FLUIDO CON ATENUADOR INFERIOR */
        .contenido-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 24px 20px; 
            padding-bottom: 60px; 
            box-sizing: border-box; 
            -webkit-overflow-scrolling: touch;
        }

        .campo-grupo { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 800; color: #6C757D; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* INPUTS Y SELECTS ESTILO APP */
        select, input { 
            padding: 14px 16px; 
            border: 2px solid #E9ECEF; 
            border-radius: 12px; 
            font-size: 15px; 
            background-color: #FFFFFF; 
            color: #212529; 
            outline: none; 
            font-weight: 600; 
            width: 100%; 
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            appearance: none;
            font-family: 'Nunito', sans-serif;
        }
        select:focus, input:focus { 
            border-color: #FBDD23; 
            box-shadow: 0 0 0 4px rgba(251,221,35,0.15); 
            transform: translateY(-1px);
        }

        /* BOTÓN PRINCIPAL */
        .btn-buscar { 
            background: linear-gradient(135deg, #FBDD23 0%, #F3C623 100%);
            color: #1e1e24; 
            border: none; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: 900; 
            border-radius: 14px; 
            cursor: pointer; 
            text-transform: uppercase; 
            margin-top: 10px; 
            box-shadow: 0 6px 15 rgba(251,221,35,0.3); 
            width: 100%; 
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            font-family: 'Nunito', sans-serif;
        }
        .btn-buscar:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(251,221,35,0.3); }

        /* RESULTADOS Y TARJETAS */
        .resultados-contenedor { margin-top: 30px; }
        .tarjeta-proveedor { 
            background: #FFFFFF; 
            border-radius: 16px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.04); 
            border: 1px solid #F1F3F5;
            transition: transform 0.2s ease;
        }
        .prov-nombre { font-size: 18px; font-weight: 900; color: #212529; margin: 0 0 8px 0; }
        .prov-zona { font-size: 13px; color: #6C757D; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 5px;}
        
        /* BOTÓN WHATSAPP */
        .btn-whatsapp { 
            display: flex; justify-content: center; align-items: center; gap: 8px;
            width: 100%; background-color: #25D366; color: white; padding: 14px; 
            border-radius: 12px; text-decoration: none; font-weight: 800; font-size: 14px; 
            box-sizing: border-box; box-shadow: 0 4px 12px rgba(37,211,102,0.25);
            transition: all 0.2s ease;
        }
        .btn-whatsapp:active { transform: scale(0.97); }

        /* ZONA LIBRE */
        .zona-libre { text-align: center; color: #6C757D; font-weight: 700; margin-top: 40px; font-size: 14px; background: #FFFFFF; padding: 30px 20px; border-radius: 16px; border: 2px dashed #DEE2E6; }
    </style>
</head>
