<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>YOCALCULO - Buscador de Mano de Obra</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #1e1e24; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
        .contenedor-app { position: relative; height: 100dvh; width: 100%; max-width: 432px; max-height: 960px; background-color: #F4F5F7; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
        .header-nativo { background-color: #4B4B4D; color: #FFFFFF; padding: 15px; display: flex; align-items: center; flex-shrink: 0; width: 100%; box-sizing: border-box; }
        .btn-back-nativo { background: transparent; border: none; color: #FFFFFF; font-size: 20px; cursor: pointer; padding: 0; margin-right: 15px; }
        .header-title { font-size: 16px; font-weight: 800; text-transform: uppercase; margin: 0; letter-spacing: 0.5px; color: #FFFFFF !important; }
        .contenido-scroll { flex: 1; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .campo-grupo { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 12px; font-weight: 700; color: #4B4B4D; text-transform: uppercase; }
        select, input { padding: 12px; border: 2px solid #EBEBEB; border-radius: 10px; font-size: 14px; background-color: #fff; color: #1e1e24; outline: none; font-weight: 600; width: 100%; box-sizing: border-box; }
        select:focus, input:focus { border-color: #FBDD23; }
        .btn-buscar { background-color: #FBDD23; color: #1e1e24; border: none; padding: 15px; font-size: 16px; font-weight: 900; border-radius: 12px; cursor: pointer; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 12px rgba(251,221,35,0.3); width: 100%; }
        .btn-buscar:active { transform: scale(0.98); }
        .resultados-contenedor { margin-top: 20px; }
        .tarjeta-proveedor { background: white; border-radius: 14px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #EBEBEB; }
        .prov-nombre { font-size: 16px; font-weight: 800; color: #1e1e24; margin: 0 0 5px 0; }
        .prov-zona { font-size: 12px; color: #7A7A7A; font-weight: 600; margin-bottom: 10px; }
        .btn-whatsapp { display: inline-block; width: 100%; text-align: center; background-color: #25D366; color: white; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: 800; font-size: 14px; box-sizing: border-box; }
        .zona-libre { text-align: center; color: #7A7A7A; font-weight: 700; margin-top: 40px; font-size: 14px; background: white; padding: 20px; border-radius: 14px; border: 1px dashed #7A7A7A; }
    </style>
</head>
<body>
    <div class="contenedor-app">
        <div class="header-nativo">
            <button class="btn-back-nativo" onclick="location.href='index.html?skip=1'">&#10094;</button>
            <h2 class="header-title">Buscador de Mano de Obra</h2>
        </div>
        <div class="contenido-scroll">
            <div class="campo-grupo">
                <label>¿Qué oficio buscás?</label>
                <select id="select-oficio">
                    <option value="manoobra">Albañil / Cuadrilla</option>
                    <option value="gasista">Gasista Matriculado</option>
                    <option value="electricista">Electricista</option>
                    <option value="herrero">Herrero</option>
                    <option value="plomero">Plomero</option>
                    <option value="techista">Techista</option>
                    <option value="pintor">Pintor</option>
                    <option value="durlero">Colocador de Durlock</option>
                </select>
            </div>
            <div class="campo-grupo">
                <label>Provincia</label>
                <select id="select-provincia">
                    <option value="Buenos Aires">Buenos Aires</option>
                    <option value="Capital Federal (CABA)">Capital Federal (CABA)</option>
                    <option value="Córdoba">Córdoba</option>
                    <option value="Santa Fe">Santa Fe</option>
                </select>
            </div>
            <div class="campo-grupo">
                <label>¿Dónde es la obra? (Localidad)</label>
                <input type="text" id="input-localidad" placeholder="Ej: Morón, San Isidro, Caseros...">
            </div>
            <button class="btn-buscar" onclick="buscarManoObra()">Buscar Especialistas</button>
            <div class="resultados-contenedor" id="resultados"></div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://dncxfkkaefjkfzdzivlz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNuY3hma2thZWZqa2Z6ZHppdmx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTA1NDcsImV4cCI6MjA5NTgyNjU0N30.BNdiLl6lbINA0WRRGexSaOd1BrNjCxTGHgQkEAsutUI';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function limpiarTexto(txt) {
            if (!txt) return "";
            return txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();
        }

        async function buscarManoObra() {
            const contenedor = document.getElementById('resultados');
            contenedor.innerHTML = '<p style="text-align:center; color:#7A7A7A; font-weight:bold;">Conectando...</p>';

            const rubroSeleccionado = document.getElementById('select-oficio').value;
            const localidadIngresada = limpiarTexto(document.getElementById('input-localidad').value);
            const provinciaSeleccionada = limpiarTexto(document.getElementById('select-provincia').value);

            if(!localidadIngresada) { alert("Por favor, ingresá una localidad."); contenedor.innerHTML=""; return; }

            try {
                // Modificado: Trae los activos del rubro específico exacto ('manoobra')
                const { data: proveedores, error } = await supabaseClient
                    .from('proveedores')
                    .select('*')
                    .eq('rubro_especifico', rubroSeleccionado)
                    .eq('estado_suscripcion', 'activa');

                if (error) throw error;

                // Modificado: Mapeo estricto con las columnas reales de tu DB (localidad y provincia)
                const filtrados = (proveedores || []).filter(p => {
                    const locBase = limpiarTexto(p.localidad || "");
                    const provBase = limpiarTexto(p.provincia || "");
                    return locBase === localidadIngresada && provBase === provinciaSeleccionada;
                });

                if (filtrados.length === 0) {
                    contenedor.innerHTML = '<div class="zona-libre"><h3>🚧 MANO DE OBRA:<br>ZONA LIBRE</h3><p style="font-size:12px; color:#7A7A7A; font-weight:500; margin:5px 0 0 0;">No hay oficiales ni contratistas registrados aquí todavía.</p></div>';
                    return;
                }

                contenedor.innerHTML = '';
                filtrados.forEach(p => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'tarjeta-proveedor';
                    const telDestino = p.telefono_whatsapp || "";
                    const msg = encodeURIComponent(`Hola ${p.nombre_comercial}, te encontré en YOCALCULO y necesito un presupuesto.`);
                    const urlWpp = `https://api.whatsapp.com/send?phone=${telDestino}&text=${msg}`;

                    tarjeta.innerHTML = `
                        <p class="prov-nombre">${p.nombre_comercial}</p>
                        <p class="prov-zona">📍 Ubicación: ${p.localidad}, ${p.provincia}</p>
                        <a href="${urlWpp}" target="_blank" class="btn-whatsapp">💬 Contactar por WhatsApp</a>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            } catch (err) {
                console.error(err);
                contenedor.innerHTML = '<p class="zona-libre">Error de respuesta en la base de datos.</p>';
            }
        }
    </script>
</body>
</html>
